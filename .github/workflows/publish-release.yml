name: Publicar bases da Release

run-name: >-
  Publicar bases ${{ github.event_name == 'workflow_dispatch'
    && 'manual'
    || 'automaticamente' }}

on:
  # Automático:
  # executa somente quando algo dentro de release-data muda na main
  push:
    branches:
      - main
    paths:
      - "release-data/**"

  # Contingência:
  # mantém o botão para executar manualmente quando necessário
  workflow_dispatch:

permissions:
  contents: write

# Impede duas publicações do Ruptura ao mesmo tempo
concurrency:
  group: publicar-bases-ruptura
  cancel-in-progress: false

jobs:
  publicar:
    name: Validar e publicar bases
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. CHECKOUT DA BRANCH MAIN
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # ============================================================
      # 2. VALIDAR ARQUIVOS OBRIGATORIOS
      # ============================================================
      - name: Validar arquivos obrigatorios
        shell: bash
        run: |
          set -euo pipefail

          arquivos=(
            "painel_autonomia.json"
            "reserva_sc.json"
            "reserva_pr.json"
            "controle_equipe.json"
            "metadata.json"
          )

          echo "=========================================="
          echo "VALIDANDO BASES DO RUPTURA"
          echo "=========================================="

          for f in "${arquivos[@]}"; do

            if [ ! -f "release-data/$f" ]; then
              echo "ERRO: release-data/$f nao encontrado"
              exit 1
            fi

            echo "Validando JSON: $f"

            python -m json.tool \
              "release-data/$f" \
              > /dev/null

            tamanho=$(du -h "release-data/$f" | cut -f1)

            echo "OK: $f - $tamanho"
          done

          echo "=========================================="
          echo "
