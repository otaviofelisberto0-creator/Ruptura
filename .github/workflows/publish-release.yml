name: Publicar bases da Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag nova, exemplo: dados-2026-11-18-1445"
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar JSONs
        run: |
          for f in painel_autonomia.json reserva_sc.json reserva_pr.json controle_equipe.json metadata.json; do
            test -f "release-data/$f"
            python -m json.tool "release-data/$f" >/dev/null
          done
      - name: Criar Release com as bases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" release-data/*.json --title "Bases Ruptura $TAG" --notes "Bases validadas do Dashboard Ruptura."

