name: Publicar bases da Release

run-name: Publicar bases ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag nova, exemplo: dados-2026-11-24-1110"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar JSONs
        run: |
          for f in painel_autonomia.json reserva_sc.json reserva_pr.json controle_equipe.json metadata.json; do
            test -f "release-data/$f" || {
              echo "ERRO: release-data/$f nao encontrado"
              exit 1
            }

            python -m json.tool "release-data/$f" > /dev/null
            echo "OK: $f"
          done

      - name: Sincronizar JSONs para data
        run: |
          mkdir -p data
          cp release-data/painel_autonomia.json data/
          cp release-data/reserva_sc.json data/
          cp release-data/reserva_pr.json data/
          cp release-data/controle_equipe.json data/
          cp release-data/metadata.json data/

      - name: Publicar data na main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "data ja esta atualizada"
          else
            git commit -m "Atualizar bases oficiais ${{ inputs.tag }}"
            git push origin HEAD:main
          fi

      - name: Criar Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" \
            release-data/painel_autonomia.json \
            release-data/reserva_sc.json \
            release-data/reserva_pr.json \
            release-data/controle_equipe.json \
            release-data/metadata.json \
            --title "Bases Ruptura $TAG" \
            --notes "Bases validadas e sincronizadas para GitHub Pages."
