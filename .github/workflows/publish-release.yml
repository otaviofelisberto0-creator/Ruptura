name: Publicar bases da Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag nova, exemplo: dados-2026-11-18-1500"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar JSONs
        run: |
          for f in painel_autonomia.json reserva_sc.json reserva_pr.json controle_equipe.json metadata.json; do
            if [ ! -f "release-data/$f" ]; then
              echo "ERRO: release-data/$f nao encontrado"
              exit 1
            fi

            python -m json.tool "release-data/$f" > /dev/null
            echo "OK: $f"
          done

      - name: Criar Release com as bases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" \
            release-data/painel_autonomia.json \
            release-data/reserva_sc.json \
            release-data/reserva_pr.json \
            release-data/controle_equipe.json \
            release-data/metadata.json \
            --title "Bases Ruptura $TAG" \
            --notes "Bases validadas do Dashboard Ruptura."
