name: Sincronizar dados da Release

run-name: >-
  Sincronizar Release para análise - ${{ github.event_name }}

on:
  # Execução automática a cada 15 minutos,
  # nos minutos 07, 22, 37 e 52.
  schedule:
    - cron: "7,22,37,52 * * * *"

  # Mantém o botão manual para contingência e testes.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sincronizar-release-data
  cancel-in-progress: false

jobs:
  sincronizar:
    name: Ler Release e carregar dados para análise
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. BAIXAR A BRANCH OFICIAL
      # ============================================================
      - name: Checkout da main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # ============================================================
      # 2. IDENTIFICAR A RELEASE MAIS RECENTE
      # ============================================================
      - name: Identificar Release mais recente
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="$(gh release view \
            --repo "${GITHUB_REPOSITORY}" \
            --json tagName \
            --jq '.tagName')"

          if [ -z "$TAG" ]; then
            echo "ERRO: nenhuma Release publicada foi encontrada."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release mais recente encontrada: $TAG"

      # ============================================================
      # 3. PREPARAR PASTA TEMPORARIA
      # ============================================================
      - name: Preparar download
        shell: bash
        run: |
          set -euo pipefail

          rm -rf release-download
          mkdir -p release-download

          echo "Pasta temporaria preparada."

      # ============================================================
      # 4. BAIXAR OS JSONS DA RELEASE MAIS RECENTE
      # ============================================================
      - name: Baixar arquivos da Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          arquivos=(
            "painel_autonomia.json"
            "reserva_sc.json"
            "reserva_pr.json"
            "controle_equipe.json"
            "metadata.json"
          )

          for arquivo in "${arquivos[@]}"; do
            echo "Baixando $arquivo da Release $RELEASE_TAG..."

            gh release download "$RELEASE_TAG" \
              --repo "${GITHUB_REPOSITORY}" \
              --pattern "$arquivo" \
              --dir release-download \
              --clobber
          done

          echo "Arquivos baixados:"
          ls -lh release-download/

      # ============================================================
      # 5. CONFIRMAR ARQUIVOS OBRIGATORIOS
      # ============================================================
      - name: Confirmar arquivos obrigatorios
        shell: bash
        run: |
          set -euo pipefail

          arquivos=(
            "painel_autonomia.json"
            "reserva_sc.json"
            "reserva_pr.json"
            "controle_equipe.json"
            "metadata.json"
          )

          echo "=========================================="
          echo "VERIFICANDO ARQUIVOS DA RELEASE"
          echo "=========================================="

          for arquivo in "${arquivos[@]}"; do
            caminho="release-download/$arquivo"

            if [ ! -f "$caminho" ]; then
              echo "ERRO: $arquivo nao foi encontrado na Release."
              exit 1
            fi

            if [ ! -s "$caminho" ]; then
              echo "ERRO: $arquivo foi baixado, mas esta vazio."
              exit 1
            fi

            tamanho="$(du -h "$caminho" | cut -f1)"
            echo "OK: $arquivo - $tamanho"
          done

      # ============================================================
      # 6. VALIDAR A SINTAXE DOS JSONS
      # ============================================================
      - name: Validar JSONs
        shell: bash
        run: |
          set -euo pipefail

          arquivos=(
            "painel_autonomia.json"
            "reserva_sc.json"
            "reserva_pr.json"
            "controle_equipe.json"
            "metadata.json"
          )

          echo "=========================================="
          echo "VALIDANDO JSONS"
          echo "=========================================="

          for arquivo in "${arquivos[@]}"; do
            caminho="release-download/$arquivo"

            echo "Validando $arquivo..."

            python -m json.tool "$caminho" > /dev/null

            echo "JSON valido: $arquivo"
          done

          echo "Todos os JSONs foram validados."

      # ============================================================
      # 7. COPIAR OS ARQUIVOS PARA DATA
      # ============================================================
      - name: Atualizar pasta data
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p data

          cp release-download/painel_autonomia.json data/
          cp release-download/reserva_sc.json data/
          cp release-download/reserva_pr.json data/
          cp release-download/controle_equipe.json data/
          cp release-download/metadata.json data/

          echo "Arquivos copiados para data/."
          ls -lh data/

      # ============================================================
      # 8. VERIFICAR SE EXISTEM ALTERACOES REAIS
      # ============================================================
      - name: Verificar alterações
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          git add \
            data/painel_autonomia.json \
            data/reserva_sc.json \
            data/reserva_pr.json \
            data/controle_equipe.json \
            data/metadata.json

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "A pasta data ja esta atualizada."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Foram encontradas novas informacoes."
          fi

      # ============================================================
      # 9. PUBLICAR OS DADOS NA MAIN
      # ============================================================
      - name: Publicar dados na main
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git commit \
            -m "Sincronizar dados da Release ${RELEASE_TAG}"

          git push origin HEAD:main

          echo "Dados da Release $RELEASE_TAG publicados na main."

      # ============================================================
      # 10. INFORMAR QUANDO NAO HOUVER NOVA BASE
      # ============================================================
      - name: Dados já atualizados
        if: steps.changes.outputs.changed == 'false'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          echo "Nenhuma atualizacao necessaria."
          echo "A Release $RELEASE_TAG ja esta carregada em data/."

      # ============================================================
      # 11. RESUMO NO GITHUB ACTIONS
      # ============================================================
      - name: Criar resumo da execução
        if: always()
        shell: bash
        run: |
          {
            echo "## Sincronização das bases do Ruptura"
            echo ""
            echo "- **Branch oficial:** main"
            echo "- **Release lida:** ${{ steps.release.outputs.tag }}"
            echo "- **Evento:** ${{ github.event_name }}"
            echo "- **Alteração encontrada:** ${{ steps.changes.outputs.changed }}"
            echo "- **Destino:** data/"
            echo ""
            echo "### Arquivos processados"
            echo ""
            echo "- painel_autonomia.json"
            echo "- reserva_sc.json"
            echo "- reserva_pr.json"
            echo "- controle_equipe.json"
            echo "- metadata.json"
          } >> "$GITHUB_STEP_SUMMARY"
