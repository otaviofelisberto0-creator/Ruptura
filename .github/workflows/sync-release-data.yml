name: Sincronizar Release e publicar Pages

run-name: >-
  Sincronizar Release e publicar site - ${{ github.event_name }}

on:
  # Verificação automática nos minutos 07, 22, 37 e 52
  schedule:
    - cron: "7,22,37,52 * * * *"

  # Publica novamente quando o index ou o workflow for alterado
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "README.md"
      - ".github/workflows/sync-release-data.yml"

  # Mantém o botão manual para testes e contingência
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ruptura-release-pages
  cancel-in-progress: false

jobs:
  sincronizar:
    name: Ler Release, atualizar dados e preparar site
    runs-on: ubuntu-latest

    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
      changed: ${{ steps.changes.outputs.changed }}

    steps:
      # ============================================================
      # 1. CHECKOUT DA BRANCH OFICIAL
      # ============================================================
      - name: Checkout da main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # ============================================================
      # 2. IDENTIFICAR A RELEASE MAIS RECENTE
      # ============================================================
      - name: Identificar Release mais recente
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="$(
            gh release view \
              --repo "${GITHUB_REPOSITORY}" \
              --json tagName \
              --jq '.tagName'
          )"

          if [ -z "$TAG" ]; then
            echo "ERRO: nenhuma Release publicada foi encontrada."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release mais recente encontrada: $TAG"

      # ============================================================
      # 3. PREPARAR PASTA TEMPORARIA
      # ============================================================
      - name: Preparar download
        shell: bash
        run: |
          set -euo pipefail

          rm -rf release-download
          mkdir -p release-download

          echo "Pasta temporaria preparada."

      # ============================================================
      # 4. BAIXAR OS JSONS DA RELEASE
      # ============================================================
      - name: Baixar arquivos da Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          arquivos=(
            "painel_autonomia.json"
            "reserva_sc.json"
            "reserva_pr.json"
            "controle_equipe.json"
            "metadata.json"
          )

          for arquivo in "${arquivos[@]}"; do
            echo "Baixando $arquivo da Release $RELEASE_TAG..."

            gh release download "$RELEASE_TAG" \
              --repo "${GITHUB_REPOSITORY}" \
              --pattern "$arquivo" \
              --dir release-download \
              --clobber
          done

          echo "Arquivos baixados:"
          ls -lh release-download/

      # ============================================================
      # 5. CONFIRMAR OS ARQUIVOS OBRIGATORIOS
      # ============================================================
      - name: Confirmar arquivos obrigatorios
        shell: bash
        run: |
          set -euo pipefail

          arquivos=(
            "painel_autonomia.json"
            "reserva_sc.json"
            "reserva_pr.json"
            "controle_equipe.json"
            "metadata.json"
          )

          echo "=========================================="
          echo "VERIFICANDO ARQUIVOS DA RELEASE"
          echo "=========================================="

          for arquivo in "${arquivos[@]}"; do
            caminho="release-download/$arquivo"

            if [ ! -f "$caminho" ]; then
              echo "ERRO: $arquivo nao foi encontrado na Release."
              exit 1
            fi

            if [ ! -s "$caminho" ]; then
              echo "ERRO: $arquivo foi baixado, mas esta vazio."
              exit 1
            fi

            tamanho="$(du -h "$caminho" | cut -f1)"
            echo "OK: $arquivo - $tamanho"
          done

      # ============================================================
      # 6. VALIDAR A SINTAXE DOS JSONS
      # ============================================================
      - name: Validar JSONs
        shell: bash
        run: |
          set -euo pipefail

          arquivos=(
            "painel_autonomia.json"
            "reserva_sc.json"
            "reserva_pr.json"
            "controle_equipe.json"
            "metadata.json"
          )

          echo "=========================================="
          echo "VALIDANDO JSONS"
          echo "=========================================="

          for arquivo in "${arquivos[@]}"; do
            caminho="release-download/$arquivo"

            echo "Validando $arquivo..."
            python -m json.tool "$caminho" > /dev/null
            echo "JSON valido: $arquivo"
          done

          echo "Todos os JSONs foram validados."

      # ============================================================
      # 7. ATUALIZAR A PASTA DATA
      # ============================================================
      - name: Atualizar pasta data
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p data

          cp release-download/painel_autonomia.json data/
          cp release-download/reserva_sc.json data/
          cp release-download/reserva_pr.json data/
          cp release-download/controle_equipe.json data/
          cp release-download/metadata.json data/

          echo "Arquivos copiados para data/:"
          ls -lh data/

      # ============================================================
      # 8. VERIFICAR ALTERACOES REAIS
      # ============================================================
      - name: Verificar alteracoes
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          git add \
            data/painel_autonomia.json \
            data/reserva_sc.json \
            data/reserva_pr.json \
            data/controle_equipe.json \
            data/metadata.json

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "A pasta data ja esta atualizada."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Foram encontradas novas informacoes."
          fi

      # ============================================================
      # 9. SALVAR OS NOVOS DADOS NA MAIN
      # ============================================================
      - name: Publicar dados na main
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git commit \
            -m "Sincronizar dados da Release ${RELEASE_TAG}"

          git push origin HEAD:main

          echo "Dados da Release $RELEASE_TAG publicados na main."

      # ============================================================
      # 10. VALIDAR ARQUIVOS PARA O SITE
      # ============================================================
      - name: Validar estrutura do site
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "index.html" ]; then
            echo "ERRO: index.html nao encontrado na raiz."
            exit 1
          fi

          arquivos=(
            "data/painel_autonomia.json"
            "data/reserva_sc.json"
            "data/reserva_pr.json"
            "data/controle_equipe.json"
            "data/metadata.json"
          )

          for arquivo in "${arquivos[@]}"; do
            if [ ! -s "$arquivo" ]; then
              echo "ERRO: $arquivo nao existe ou esta vazio."
              exit 1
            fi
          done

          echo "Estrutura do site validada."

      # ============================================================
      # 11. CONFIGURAR O GITHUB PAGES
      # ============================================================
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      # ============================================================
      # 12. EMPACOTAR O SITE
      # ============================================================
      - name: Enviar artefato do GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      # ============================================================
      # 13. RESUMO DA SINCRONIZACAO
      # ============================================================
      - name: Criar resumo da sincronizacao
        if: always()
        shell: bash
        run: |
          {
            echo "## Ruptura - sincronização"
            echo ""
            echo "- **Branch oficial:** main"
            echo "- **Release lida:** ${{ steps.release.outputs.tag }}"
            echo "- **Evento:** ${{ github.event_name }}"
            echo "- **Dados alterados:** ${{ steps.changes.outputs.changed }}"
            echo "- **Destino dos JSONs:** data/"
            echo "- **Artefato do Pages:** preparado"
            echo ""
            echo "### Arquivos processados"
            echo ""
            echo "- painel_autonomia.json"
            echo "- reserva_sc.json"
            echo "- reserva_pr.json"
            echo "- controle_equipe.json"
            echo "- metadata.json"
          } >> "$GITHUB_STEP_SUMMARY"

  # ==============================================================
  # 14. PUBLICAR O SITE NO GITHUB PAGES
  # ==============================================================
  publicar:
    name: Publicar dashboard no GitHub Pages
    needs: sincronizar
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Criar resumo da publicacao
        shell: bash
        run: |
          {
            echo "## Ruptura - publicação concluída"
            echo ""
            echo "- **Release utilizada:** ${{ needs.sincronizar.outputs.release_tag }}"
            echo "- **Dados alterados:** ${{ needs.sincronizar.outputs.changed }}"
            echo "- **Site:** ${{ steps.deployment.outputs.page_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
